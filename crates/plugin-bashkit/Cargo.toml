[package]
name = "plugin-bashkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# A dynamic library only. A Host that links this Plugin in adds an rlib
# and a feature gating `export_plugin!`, as hello-plugin has.
[lib]
crate-type = ["cdylib"]

[dependencies]
runvil-plugin-sdk.workspace = true

[dev-dependencies.runvil-plugin-sdk]
workspace = true
features = ["test-support"]

[lints]
workspace = true
